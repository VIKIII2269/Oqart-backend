      tags:
      - User Management
  /users/me/addresses:
    get:
      consumes:
      - application/json
      description: Get all addresses for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_oqart_backend_internal_delivery_http_dto.AddressResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user addresses
      tags:
      - Address Management
    post:
      consumes:
      - application/json
      description: Create a new address for the authenticated user
      parameters:
      - description: Address data
        in: body
        name: request
        required: true
        schema:

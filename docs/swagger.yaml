        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
      security:
      - BearerAuth: []

host: localhost:8080
info:
  contact:
    email: support@oqart.com
    name: API Support
    url: https://oqart.com/support
  description: Production-grade e-commerce backend for OQart - India's premier organic
    products marketplace
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://oqart.com/terms
  title: OQart Backend API
  version: "1.0"
paths:
  /admin/vendors/{id}/approve:
    post:
      consumes:
      - application/json
      description: Admin endpoint to approve, reject, or suspend a vendor
      parameters:
      - description: Vendor ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Approval decision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oqart_backend_internal_delivery_http_dto.AdminVendorApprovalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Vendor status updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid input or validation error
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "403":
          description: Forbidden - Admin access required
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "404":
          description: Vendor not found
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve or reject vendor (Admin only)
      tags:
      - Admin - Vendor Management
  /admin/vendors/documents/{id}/verify:
    put:
      consumes:
      - application/json
      description: Admin endpoint to verify or reject a vendor's uploaded document
      parameters:
      - description: Document ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Verification decision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oqart_backend_internal_delivery_http_dto.AdminDocumentVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Document verified successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid input or validation error
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "403":
          description: Forbidden - Admin access required
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "404":
          description: Document not found
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify or reject vendor document (Admin only)
      tags:
      - Admin - Vendor Management
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send password reset link to email
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oqart_backend_internal_delivery_http_dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_oqart_backend_internal_delivery_http_dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
      summary: Request password reset
      tags:
      - Authentication
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oqart_backend_internal_delivery_http_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_oqart_backend_internal_delivery_http_dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
      summary: Login with email and password
      tags:
      - Authentication
  /auth/login/phone:
    post:
      consumes:
      - application/json
      description: Send OTP for phone number authentication
      parameters:
      - description: Phone number
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oqart_backend_internal_delivery_http_dto.PhoneLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_oqart_backend_internal_delivery_http_dto.OTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
      summary: Send OTP to phone number
      tags:
      - Authentication
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout user and invalidate all sessions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_oqart_backend_internal_delivery_http_dto.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Authentication
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Get new access token using refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oqart_backend_internal_delivery_http_dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_oqart_backend_internal_delivery_http_dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
      summary: Refresh access token
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email and password
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_oqart_backend_internal_delivery_http_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_oqart_backend_internal_delivery_http_dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_oqart_backend_pkg_errors.ErrorResponse'
        "500":

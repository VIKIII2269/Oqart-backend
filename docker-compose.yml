version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: oqart-postgres
    environment:
      POSTGRES_USER: oqart
      POSTGRES_PASSWORD: oqart
      POSTGRES_DB: oqart
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oqart"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oqart-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: oqart-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - oqart-network

  # API Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oqart-api
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - PORT=8080
      - DATABASE_URL=postgresql://oqart:oqart@postgres:5432/oqart?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your-super-secret-key-min-32-chars-change-in-production
      - LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./.env:/app/.env:ro
    networks:
      - oqart-network
    restart: unless-stopped

  # Database Migrations (run once)
  migrate:
    image: migrate/migrate:latest
    container_name: oqart-migrate
    volumes:
      - ./migrations:/migrations
    command: >
      -path /migrations
      -database "postgresql://oqart:oqart@postgres:5432/oqart?sslmode=disable"
      up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oqart-network
    profiles:
      - tools

  # Adminer (Database Management UI - Optional)
  adminer:
    image: adminer:latest
    container_name: oqart-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - oqart-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  oqart-network:
    driver: bridge
